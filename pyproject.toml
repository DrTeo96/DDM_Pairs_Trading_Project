[project]
name = "ddm-luiss-project"
version = "0.1.0"
description = "Pair trading sui titoli dell'S&P 500 con dati Bloomberg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

# Il progetto è installato nell'ambiente (in modo modificabile) da `uv sync`: così `from src.config import ...`
# funziona da qualsiasi cartella, nei notebook e dal terminale, senza toccare sys.path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 180
