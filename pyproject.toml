[project]
name = "ddm-luiss-project"
version = "0.1.0"
description = "Pair trading sui titoli dell'S&P 500 con dati Bloomberg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.ruff]
line-length = 180
